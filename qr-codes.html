
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>QRental | QR코드 자동 생성</title>
  <link rel="stylesheet" href="style.css">

  <style>
    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      margin: 0;
      background: #202936;
      color: #f4f7fb;
      font-family: Arial, sans-serif;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
      padding: 28px 18px;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
      margin-bottom: 25px;
    }

    .panel {
      background: #303d4d;
      padding: 24px;
      border: 1px solid #485667;
      border-radius: 18px;
      margin-bottom: 20px;
    }

    h1, h2 {
      margin-top: 0;
    }

    p {
      line-height: 1.6;
    }

    .muted {
      color: #bfd1e2;
      font-size: 14px;
    }

    a {
      color: #a8ceff;
    }

    input, select {
      padding: 12px;
      background: #1e2937;
      color: white;
      border: 1px solid #70829a;
      border-radius: 10px;
      font-size: 14px;
      max-width: 100%;
    }

    input {
      flex: 1;
      min-width: 160px;
    }

    button {
      border: 0;
      background: #86b7f2;
      color: #14253a;
      padding: 12px 16px;
      border-radius: 10px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .controls {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .qr-grid {
      display: grid;
      grid-template-columns:
        repeat(auto-fill, minmax(220px, 1fr));
      gap: 16px;
    }

    .qr-card {
      background: white;
      color: #182637;
      border-radius: 15px;
      padding: 20px;
      text-align: center;
      break-inside: avoid;
      page-break-inside: avoid;
      overflow-wrap: anywhere;
    }

    .qr-card h3 {
      font-size: 18px;
      margin: 0 0 8px;
    }

    .qr-card p {
      color: #53667b;
      font-size: 12px;
      margin: 7px 0;
    }

    .qr-image {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 175px;
      margin: 12px 0;
    }

    .qr-image img,
    .qr-image canvas {
      max-width: 100%;
      height: auto;
    }

    .status {
      font-weight: bold;
      font-size: 13px;
    }

    .error {
      color: #ffb5b5;
    }

    .pagination {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 22px 0;
    }

    .print-title {
      display: none;
    }

    @media print {
      @page {
        size: A4;
        margin: 12mm;
      }

      body {
        background: white;
        color: black;
      }

      .no-print {
        display: none !important;
      }

      .container {
        max-width: none;
        padding: 0;
      }

      .print-title {
        display: block;
        text-align: center;
        margin: 0 0 15px;
        font-size: 20px;
      }

      .qr-grid {
        grid-template-columns:
          repeat(3, minmax(0, 1fr));
        gap: 10px;
      }

      .qr-card {
        border: 1px solid #999;
        border-radius: 5px;
        padding: 10px;
      }

      .qr-card h3 {
        font-size: 15px;
      }

      .qr-image {
        min-height: 150px;
        margin: 6px 0;
      }

      .qr-image canvas,
      .qr-image img {
        width: 150px;
        height: 150px;
      }
    }
  </style>
</head>

<body>
  <main class="container">

    <header class="header no-print">
      <div>
        <p style="color:#86b7f2">
          QRENTAL / ADMIN
        </p>
        <h1>물품별 QR코드 자동 생성</h1>
      </div>

      <a href="admin.html">
        ← 관리자 화면으로
      </a>
    </header>

    <section id="authPanel" class="panel no-print">
      <h2>관리자 권한 확인 중...</h2>
      <p class="muted">
        Firebase 계정을 확인하고 있어요.
      </p>
    </section>

    <div id="qrApp" hidden>

      <section class="panel no-print">
        <h2>QR코드 자동 생성 완료</h2>

        <p class="muted">
          등록된 물품의 QR코드를 자동으로 만들어요.
          주소를 직접 입력할 필요가 없습니다.
        </p>

        <p id="itemCount">
          물품 목록을 불러오는 중...
        </p>

        <div class="controls">
          <input
            id="searchInput"
            type="search"
            placeholder="물품 이름 검색"
            aria-label="물품 이름 검색"
          >

          <select id="pageSize"
                  aria-label="한 페이지 표시 개수">
            <option value="12">12개씩 보기</option>
            <option value="24">24개씩 보기</option>
            <option value="48">48개씩 보기</option>
          </select>

          <button id="printButton" type="button">
            🖨️ 현재 페이지 QR코드 인쇄
          </button>
        </div>

        <p id="qrMessage" class="muted"
           role="status"></p>
      </section>

      <h2 class="print-title">
        QRental 물품 QR코드
      </h2>

      <section id="qrGrid" class="qr-grid"></section>

      <div class="pagination no-print">
        <button id="prevButton" type="button">
          이전
        </button>

        <span id="pageText">1 / 1</span>

        <button id="nextButton" type="button">
          다음
        </button>
      </div>

    </div>
  </main>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>

  <script type="module">
    import { auth, db } from "./firebase-config.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      collection,
      onSnapshot
    } from "https://www.gstatic.com/firebasejs/13.1.0/firebase-firestore.js";

    const $ = id => document.getElementById(id);

    // QRental의 실제 인터넷 주소
    // 127.0.0.1이나 localhost는 사용하지 않음
    const SITE_URL =
      "https://sibygyun08.github.io/qr-rental/index.html";

    let items = [];
    let filteredItems = [];
    let verifiedAdmin = false;
    let unsubscribe = null;
    let authGeneration = 0;
    let currentPage = 1;
    let pageSize = 12;

    function setMessage(message, error = false) {
      $("qrMessage").textContent = message;
      $("qrMessage").className =
        error ? "error" : "muted";
    }

    function showAuthMessage(title, message) {
      const panel = $("authPanel");
      panel.replaceChildren();

      const h2 = document.createElement("h2");
      h2.textContent = title;

      const p = document.createElement("p");
      p.textContent = message;

      panel.append(h2, p);

      if (title === "로그인이 필요합니다") {
        const link = document.createElement("a");
        link.href = "login.html";
        link.textContent = "관리자 로그인 화면으로 이동";
        panel.appendChild(link);
      }

      panel.hidden = false;
    }

    function makeCard(item) {
      const card = document.createElement("article");
      card.className = "qr-card";

      const title = document.createElement("h3");
      title.textContent = item.name || "이름 없는 물품";

      const description = document.createElement("p");
      description.textContent =
        item.description || "QRental 공용 물품";

      const qrBox = document.createElement("div");
      qrBox.className = "qr-image";

      const status = document.createElement("p");
      status.className = "status";
      status.textContent =
        item.status === "rented"
          ? "현재 대여 중"
          : "대여 가능";

      card.append(
        title,
        description,
        qrBox,
        status
      );

      const target = new URL(SITE_URL);
      target.searchParams.set("item", item.id);

      try {
        new QRCode(qrBox, {
          text: target.toString(),
          width: 165,
          height: 165,
          colorDark: "#14253a",
          colorLight: "#ffffff",
          correctLevel: QRCode.CorrectLevel.M
        });
      } catch (error) {
        console.error("QR코드 생성 오류:", error);

        const failure = document.createElement("p");
        failure.textContent = "QR코드 생성 실패";
        qrBox.replaceChildren(failure);
      }

      return card;
    }

    function render() {
      if (!verifiedAdmin) return;

      const keyword = $("searchInput")
        .value.trim().toLowerCase();

      filteredItems = items.filter(item =>
        (item.name || "").toLowerCase().includes(keyword) ||
        (item.description || "").toLowerCase().includes(keyword)
      );

      const totalPages = Math.max(
        1,
        Math.ceil(filteredItems.length / pageSize)
      );

      currentPage = Math.min(
        Math.max(1, currentPage),
        totalPages
      );

      const start = (currentPage - 1) * pageSize;

      const visibleItems = filteredItems.slice(
        start,
        start + pageSize
      );

      const grid = $("qrGrid");
      grid.replaceChildren();

      if (typeof QRCode === "undefined") {
        setMessage(
          "QR코드 라이브러리를 불러오지 못했어요. 인터넷 연결을 확인해 주세요.",
          true
        );

        $("printButton").disabled = true;
        return;
      }

      for (const item of visibleItems) {
        grid.appendChild(makeCard(item));
      }

      $("itemCount").textContent =
        `전체 물품 ${items.length}개 / 검색 결과 ${filteredItems.length}개`;

      $("pageText").textContent =
        `${currentPage} / ${totalPages}`;

      $("prevButton").disabled =
        currentPage === 1;

      $("nextButton").disabled =
        currentPage === totalPages;

      $("printButton").disabled =
        visibleItems.length === 0;

      setMessage(
        visibleItems.length
          ? `QR코드 ${visibleItems.length}개가 자동 생성됐어요. 인쇄하면 현재 페이지의 QR코드가 출력됩니다.`
          : "표시할 물품이 없습니다."
      );
    }

    $("searchInput").addEventListener(
      "input",
      () => {
        currentPage = 1;
        render();
      }
    );

    $("pageSize").addEventListener(
      "change",
      () => {
        pageSize = Number($("pageSize").value);
        currentPage = 1;
        render();
      }
    );

    $("prevButton").addEventListener(
      "click",
      () => {
        if (currentPage > 1) {
          currentPage--;
          render();
          window.scrollTo(0, 0);
        }
      }
    );

    $("nextButton").addEventListener(
      "click",
      () => {
        const totalPages = Math.ceil(
          filteredItems.length / pageSize
        );

        if (currentPage < totalPages) {
          currentPage++;
          render();
          window.scrollTo(0, 0);
        }
      }
    );

    $("printButton").addEventListener(
      "click",
      () => {
        if (!verifiedAdmin) return;
        window.print();
      }
    );

    onAuthStateChanged(auth, async user => {
      const generation = ++authGeneration;

      verifiedAdmin = false;
      items = [];

      $("qrApp").hidden = true;
      $("qrGrid").replaceChildren();

      if (unsubscribe) {
        unsubscribe();
        unsubscribe = null;
      }

      if (!user) {
        showAuthMessage(
          "로그인이 필요합니다",
          "QR코드 생성은 관리자만 사용할 수 있어요."
        );
        return;
      }

      showAuthMessage(
        "관리자 확인 중...",
        "계정 권한을 확인하고 있어요."
      );

      try {
        const adminDoc = await getDoc(
          doc(db, "admins", user.uid)
        );

        if (generation !== authGeneration) return;

        if (
          !adminDoc.exists() ||
          adminDoc.data().role !== "admin"
        ) {
          showAuthMessage(
            "접근할 수 없습니다",
            "관리자 권한이 없는 계정입니다."
          );
          return;
        }

        verifiedAdmin = true;

        $("authPanel").hidden = true;
        $("qrApp").hidden = false;

        unsubscribe = onSnapshot(
          collection(db, "equipment"),
          snapshot => {
            if (generation !== authGeneration) return;

            items = snapshot.docs.map(itemDoc => ({
              id: itemDoc.id,
              ...itemDoc.data()
            }));

            items.sort(
              (a, b) =>
                (a.name || "").localeCompare(
                  b.name || "",
                  "ko"
                )
            );

            render();
          },
          error => {
            if (generation !== authGeneration) return;

            console.error("물품 조회 오류:", error);
            setMessage(
              "물품 목록을 불러오지 못했어요.",
              true
            );
          }
        );

      } catch (error) {
        if (generation !== authGeneration) return;

        console.error("관리자 확인 오류:", error);

        showAuthMessage(
          "관리자 확인 실패",
          "계정 권한을 확인하지 못했어요."
        );
      }
    });
  </script>
</body>
</html>
